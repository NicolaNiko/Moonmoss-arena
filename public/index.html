<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Moonmoss Arena Online</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell"><header><p class="eyebrow">ONLINE LO-FI FANTASY DUEL</p><h1>Moonmoss Arena</h1><p class="tagline">Find a rival. Win the grove.</p></header>
<section class="hud"><div class="fighter-card ember-card"><span class="name" id="p1-name">YOU</span><div class="health"><i id="p1-health"></i></div><span class="score">Wins: <b id="p1-score">0</b></span></div><div class="round" id="round-text">FIRST TO 3</div><div class="fighter-card moss-card"><span class="name" id="p2-name">RIVAL</span><div class="health"><i id="p2-health"></i></div><span class="score">Wins: <b id="p2-score">0</b></span></div></section>
<section class="arena-wrap"><canvas id="arena" width="960" height="540"></canvas><div class="message" id="message"><label>Your name <input id="nickname" maxlength="14" placeholder="Wanderer"></label><button id="find-match">Find random opponent</button><small id="status">Two players are needed to start.</small></div></section>
<section class="controls"><div><strong>YOUR SPELLS</strong><span>Move: W A S D · Strike: F · Dash: G · Bolt: R · Shield: T</span></div><div><strong>HOW IT WORKS</strong><span>Press Find Match. The first available player becomes your rival.</span></div></section></main><script src="game.js"></script></body></html>
